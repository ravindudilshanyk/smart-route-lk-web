name: E2E Banner Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: smartroute_lk
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d smartroute_lk"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Configure backend env
        run: |
          cat > backend/.env <<'EOF'
          PORT=5000
          NODE_ENV=production

          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_NAME=smartroute_lk
          DB_USER=postgres
          DB_PASSWORD=postgres

          REDIS_URL=redis://127.0.0.1:6379

          JWT_SECRET=ci_secret
          JWT_EXPIRES_IN=7d

          FRONTEND_URL=http://localhost:5174
          APP_URL=http://localhost:5000
          EOF

      - name: Start backend
        working-directory: backend
        run: |
          npm run start &
          echo "Backend starting..."

      - name: Initialize database schema
        working-directory: backend
        run: |
          node src/scripts/init_db.js

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl -sSf http://localhost:5000/health >/dev/null; then echo backend up && break; fi
            sleep 2
          done

      - name: Install frontend deps
        working-directory: frontend
        run: |
          npm ci

      - name: Install Playwright chromium
        working-directory: frontend
        run: npx playwright install chromium

      - name: Run E2E banner runner
        working-directory: frontend
        env:
          BACKEND_URL: http://localhost:5000
          FRONTEND_URL: http://localhost:5174
        run: |
          npm run test:e2e:local
